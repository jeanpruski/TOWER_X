name: Verify TOWER X
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: tower
          POSTGRES_DB: tower_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tower -d tower_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate:chunks
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://tower:tower@localhost:5432/tower_test
      - run: node --import tsx scripts/postgres-smoke.ts
        env:
          DATABASE_URL: postgresql://tower:tower@localhost:5432/tower_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
