services:
  game:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://tower:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tower?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3001'
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tower
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tower -d tower']
      interval: 5s
      timeout: 3s
      retries: 10
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
